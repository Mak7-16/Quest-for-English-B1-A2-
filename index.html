<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Escape Room</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--ac:#ff8a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{min-height:100vh;color:#f5f1ff;background:#1a1030;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .6s}
.card{background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(6px);border-radius:1rem}
.btn{background:var(--ac);color:#111;font-weight:700;border-radius:.75rem;padding:.6rem 1.1rem;transition:transform .15s}
.btn:hover{transform:scale(1.04)}
.inp{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:.6rem;padding:.55rem .8rem;color:#fff;width:100%}
.inp option{color:#111}
.obj{font-size:3rem;padding:.8rem;border-radius:1rem;background:rgba(255,255,255,.08);transition:transform .15s}
.obj:hover{transform:scale(1.12) rotate(-4deg);background:rgba(255,255,255,.18)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fall{position:fixed;top:-3rem;pointer-events:none;opacity:.5;animation:fl linear infinite;z-index:0}
@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
.sel{outline:3px solid var(--ac);background:rgba(255,255,255,.25)}
.dig{width:3.5rem;height:4.5rem;text-align:center;font-size:2rem;font-weight:800}
</style>
</head>
<body>
<div id="fx"></div>
<main class="relative z-10 max-w-3xl mx-auto p-4">

<section id="menu" class="card p-6 mt-6 text-center space-y-4">
  <div class="text-5xl">🗝️</div>
  <h1 class="text-3xl font-extrabold">Holiday Escape Room</h1>
  <p class="opacity-80">Вебквест для вивчення англійської. Розв’яжіть загадки та відчиніть двері!</p>
  <label class="block text-left text-sm">Свято / подія
    <select id="hol" class="inp mt-1">
      <option value="halloween">🎃 Хелловін (Halloween)</option>
      <option value="christmas">🎄 Різдво (Christmas)</option>
      <option value="valentine">💘 День Святого Валентина (St. Valentine’s Day)</option>
      <option value="easter">🐰 Великдень (Easter)</option>
      <option value="newyear">🎆 Новий Рік (New Year)</option>
    </select></label>
  <label class="block text-left text-sm">Рівень англійської
    <select id="lvl" class="inp mt-1">
      <option value="0">A1 – Beginner</option><option value="1">A2 – Elementary</option>
      <option value="2" selected>B1 – Intermediate</option><option value="3">B2 – Upper-Intermediate</option>
      <option value="4">C1 – Advanced</option><option value="5">C2 – Proficiency</option>
    </select></label>
  <button class="btn w-full text-lg" onclick="start()">Розпочати квест</button>
</section>

<section id="game" class="hidden space-y-3 mt-2">
  <div class="card p-3 flex items-center justify-between gap-2 flex-wrap">
    <div id="ttl" class="font-bold"></div>
    <div id="prog" class="text-xl tracking-widest"></div>
    <div class="font-mono">⏱ <span id="tm">00:00</span></div>
  </div>
  <div id="story" class="card p-4 italic"></div>
  <div id="stage" class="card p-4"></div>
  <div id="msg" class="card p-3 min-h-[3rem]"></div>
  <div class="card p-3">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <div><span class="text-sm opacity-70">🎒 Інвентар:</span> <span id="inv"></span></div>
      <div class="text-sm">🔢 Код: <b id="dgs" class="text-lg"></b></div>
      <button class="btn" onclick="hint()">💡 Hint</button>
    </div>
  </div>
</section>

<section id="win" class="hidden card p-6 mt-6 text-center space-y-4">
  <div class="text-6xl">🏆</div>
  <h2 class="text-3xl font-extrabold">You escaped!</h2>
  <p>Ви втекли за <b id="wt" class="text-xl"></b>. Підказок використано: <b id="wh"></b></p>
  <div class="text-left"><h3 class="font-bold mb-2">📖 Словничок квесту</h3><ul id="gl" class="grid sm:grid-cols-2 gap-2"></ul></div>
  <button class="btn" onclick="location.reload()">Грати ще раз</button>
</section>
</main>

}
function bar(){
  $('prog').textContent=[0,1,2,3,4].map(i=>i<S.st?'✅':i===S.st?'🔸':'⚪').join(' ');
  $('dgs').textContent=[0,1,2].map(i=>S.dg[i]??'_').join(' ');
  $('inv').innerHTML=S.inv.length?S.inv.map((x,i)=>`<button class="obj !text-2xl !p-2 ${S.sel===i?'sel':''}" title="${x[1]}" onclick="selItem(${i})">${x[0]}</button>`).join(''):'<i class="opacity-60">—</i>';
}
function selItem(i){S.sel=S.sel===i?null:i;bar();say(S.sel===null?'':`<b>${S.inv[i][0]} ${S.inv[i][1]}</b> ${P(['is selected. Click an object.','is selected. Where could you use it?','is in your hand. Where might it fit?'])}`)}
function render(){
  const H=S.H,st=$('stage');bar();
  if(S.st===0){
    st.innerHTML=`<h2 class="font-bold text-lg mb-2">🔤 Puzzle 1 · Who am I?</h2><p class="mb-3">${P(H.c)}</p>
    <p class="text-3xl font-mono tracking-[.3em] text-center mb-3" style="color:var(--ac)">${scr(H.w).toUpperCase()}</p>
    <div class="flex gap-2"><input id="a1" class="inp" placeholder="Your answer…" onkeydown="if(event.key==='Enter')c1()"><button class="btn" onclick="c1()">OK</button></div>`;
    say(P(['Unscramble the letters.','Unscramble the letters and solve the riddle.','Decipher the anagram, guided by the cryptic description.']));
  }else if(S.st===1){
    st.innerHTML=`<h2 class="font-bold text-lg mb-2">🔎 Puzzle 2 · Search the room</h2><p class="mb-3">${P(['Click the things. Read the facts. Go to Room 2. Use your item on the chest.','Click objects to read fun facts. Go to the other room, select your item in the bag, then click the chest.','Rummage through both rooms; the locked chest awaits in the second, and your inventory holds the key.'])}</p><p class="text-xs opacity-70 mb-3">📌 Що робити: клікайте на предмети (читайте цікавинки) → 🚪 перейдіть у Room 2 → у «Інвентарі» натисніть свій предмет (він підсвітиться) → натисніть на скриню 🧰. Усередині — цифра коду.</p>
    <div class="flex flex-wrap gap-3 justify-center items-center">${(S.room?H.o2:H.obj).map((o,i)=>`<button class="obj" onclick="look(${i})">${o[0]}</button>`).join('')}${S.room?'<button id="chest" class="obj" onclick="chest()">🧰</button>':''}<button class="btn" onclick="go()">🚪 ${P(['Next room','Go to the other room','Venture into the adjoining chamber'])}</button></div><p class="mt-3 text-sm opacity-70 text-center">${S.room?'📍 Room 2':'📍 Room 1'}</p>`;
  }else if(S.st===2){
    S.qa=S.qa||[];st.innerHTML=qz();say('🏛️');
  }else if(S.st===3){
    st.innerHTML=`<h2 class="font-bold text-lg mb-2">📖 Puzzle 4 · Read and answer</h2><p class="mb-3 p-3 rounded-lg bg-white/10">${P(H.t)}</p>
    <p class="font-semibold mb-2">❓ ${P(H.q)}</p><div class="flex gap-2"><input id="a3" type="number" class="inp" placeholder="Number" onkeydown="if(event.key==='Enter')c3()"><button class="btn" onclick="c3()">OK</button></div>`;
    say(P(['Read the text. Write a number.','Read the text carefully and write the number.','Peruse the passage and supply the numerical answer.']));
  }else{
    st.innerHTML=`<h2 class="font-bold text-lg mb-2">🔐 Final door · Enter the code</h2><p class="mb-3">${P(['Use the 3 numbers. Open the door!','Enter the three digits you have collected.','Enter the combination you have painstakingly pieced together.'])}</p>
    <div class="flex gap-2 justify-center mb-3" id="lock">${[0,1,2].map(i=>`<input class="inp dig" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/\\D/g,'');if(this.value&&this.nextElementSibling)this.nextElementSibling.focus()">`).join('')}</div>
    <div class="text-center"><button class="btn" onclick="c4()">🔓 Open</button></div>`;
    say('🚪');
  }
}
function bad(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),400);say('❌ '+P(['Try again!','Not quite. Try again.','Regrettably not; give it another go.']))}
function c1(){
  const v=$('a1').value.trim().toLowerCase(),H=S.H;
  if(v!==H.w)return bad($('stage'));
  S.dg.push(S.d[0]);S.inv.push(H.it);S.st=1;render();
  say(`✅ ${P(['Yes! You get a number and an item:','Correct! You find a number and an item:','Spot on! You have gained a digit and an item:'])} <b>${S.d[0]}</b> · ${H.it[0]} <b>${H.it[1]}</b>`);
}
function look(i){
  const[e,n,a]=(S.room?S.H.o2:S.H.obj)[i],f=S.H.f[(S.room?3:0)+i];
  say(`${e} `+P([`You find a ${n}. It is ${a}.`,`Among the shelves you notice a ${n}, which looks ${a}.`,`Tucked behind the clutter, a ${a} ${n} catches your eye, as though it had been waiting for you.`])+`<div class="mt-2 text-sm p-2 rounded-lg bg-white/10">💡 <b>Fun fact:</b> ${f[0]}<br><i class="opacity-70">${f[1]}</i></div>`);
}
function chest(){
  const H=S.H;
  if(S.open)return say('📦 '+P(['The chest is open.','The chest is already open.','The chest has already yielded its secret.']));
  if(S.sel===null||S.inv[S.sel]!==H.it)return bad($('chest'))||say('🔒 '+P(['The chest is locked.','The chest is locked tight. Maybe something in your inventory fits.','The chest is firmly locked; perhaps one of your belongings is up to the task.']));
  S.open=true;S.dg.push(S.d[1]);S.inv.splice(S.sel,1);S.sel=null;S.st=2;
  say(`🎉 ${P(['It opens! A number:','Click! Inside is a number:','With a satisfying click, the lid creaks open, revealing the numeral'])} <b>${S.d[1]}</b>`);
  setTimeout(render,1800);bar();
}
function c3(){
  if(+$('a3').value!==S.H.a||$('a3').value==='')return bad($('stage'));
  S.dg.push(S.H.a);S.st=4;render();
}
function c4(){
  const v=[...document.querySelectorAll('#lock input')].map(i=>i.value).join('');
  if(v!==S.dg.join(''))return bad($('lock'));
  const s=(Date.now()-S.t0)/1000|0;
  $('wt').textContent=tm(s/60|0)+':'+tm(s%60);$('wh').textContent=S.hints;
  $('gl').innerHTML=(S.H.g+'|'+S.H.g2).split('|').map(x=>x.split(':')).map(([e,u])=>`<li class="bg-white/10 rounded-lg px-3 py-2"><b>${e}</b> — ${u}</li>`).join('');
  $('game').classList.add('hidden');$('win').classList.remove('hidden');
}
function hint(){
  S.hints++;const w=S.H.w,n=w.length;
  const h=[
   [`The word starts with "${w[0]}". It has ${n} letters.`,`Look at the letters. The first letter is "${w[0]}" and the word has ${n} letters.`,`Rearrange the jumbled letters; the initial letter is "${w[0]}" and the word runs to ${n} letters.`],
   [`Go to the other room. Click the ${S.H.it[1]} in your bag. Then click the chest.`,`Visit the other room, select the item in your inventory, then use it on the chest.`,`Peruse every nook; the item you have acquired may well unlock the one thing that refuses to budge.`],
   [`Think about the holiday and the fun facts.`,`Think about the holiday and the fun facts you found.`,`Draw on the trivia you have gleaned along the way.`],
   [`Read the text again. Look for numbers.`,`Reread carefully and do a little arithmetic.`,`Scrutinise the figures mentioned and work out the remainder.`],
   [`Use the 3 numbers. Put them in order: 1, 2, 3.`,`Combine the three digits you collected, in the order you found them.`,`The combination is the three digits you have amassed, in strict chronological order.`]];
  say('💡 '+P(h[S.st]));
}
</script>
</body>
</html>
